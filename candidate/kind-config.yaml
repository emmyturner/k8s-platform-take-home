# One control plane and two workers, so draining a node and spreading pods mean something.
# kind's default CNI is replaced with Calico (installed by `make cluster`) so NetworkPolicy is enforced.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
